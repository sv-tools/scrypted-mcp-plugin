name: Publish

on:
  push:
    # Trigger on semver tags like v1.0.7. Push the tag with `git tag v1.0.7 && git push --tags`
    # after bumping the version in package.json.
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token is required for npm publish provenance — provenance signs the package
      # via the GitHub OIDC token so consumers can verify it was built by this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # Configures npm with the registry URL so NODE_AUTH_TOKEN is honored at publish.
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package.json version matches git tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Publishing scrypted-mcp@$PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run fmt:check

      - name: ESLint
        run: npm run lint

      - name: Build (scrypted-webpack)
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
